<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lantern</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wall"></div>
<div id="dim"></div>
<div id="shade"></div>

<div id="stage">
  <div id="bar">
    <div id="clock"></div>
    <div id="info"><span id="date"></span><span id="weather"></span></div>
  </div>
  <div id="widgets"></div>
  <div id="dock"></div>
  <div id="rows"></div>
</div>

<div id="legend">
  <span id="lgall"><i class="chev"></i>All apps</span>
  <span><i class="dot red"></i>Options</span>
  <span><i class="dot green"></i>Dock</span>
  <span><i class="dot yellow"></i>Standby</span>
  <span id="lgset"><i class="dot blue"></i>Settings</span>
</div>

<div id="preview"><div id="pvlabel"></div></div>
<div id="lock"><div id="lockdate"></div><div id="locktime"></div><div id="lockwx"></div></div>

<div id="overlay"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="keysink" tabindex="-1"></div>
<script src="app.js"></script>
</body>
</html>
